# Runs when the probe changes: prints what public network endpoints answer (read-only), to confirm
# the wallet's network settings. Takes about a minute.
name: Pearl network probe
on:
  push:
    branches: [claude/stablecoin-wallet-multi-chain-sc1vbq]
    paths: ['.github/probe/**', '.github/workflows/pearl-network-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/probe/networks.mjs
