# Run by hand: prints what public network endpoints answer (read-only), to confirm
# the wallet's network settings. Takes about a minute.
name: Pearl network probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/probe/networks.mjs
