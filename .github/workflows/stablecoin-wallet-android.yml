# Builds an installable Android test APK of Pearl Wallet, checks that it starts on
# an emulator, then publishes it as a GitHub pre-release for download on a phone.
name: Pearl Wallet Android build

on:
  push:
    branches: [claude/stablecoin-wallet-multi-chain-sc1vbq]
    paths: ['stablecoin-wallet/**', '.github/workflows/stablecoin-wallet-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stablecoin-wallet-android-${{ github.ref }}
  # Queue instead of cancelling, so a running emulator check always reports.
  cancel-in-progress: false

env:
  APP_ID: com.example.stablecoinwallet

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stablecoin-wallet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stablecoin-wallet/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Unit tests
        run: npm test

      # Checks Solana support against the real network. Informational: public RPC
      # nodes can rate-limit, so a failure here doesn't block the build.
      - name: Solana network check
        continue-on-error: true
        env:
          SOLANA_LIVE: '1'
        run: npx jest __tests__/solana.live.test.ts

      # Has real Tron nodes build transfers (nothing is signed or sent) and checks the
      # app's strict pre-sign check accepts them. Informational, like the Solana check.
      - name: Tron network check
        continue-on-error: true
        env:
          TRON_LIVE: '1'
        run: npx jest __tests__/tron.live.test.ts

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Signed with the template's shared debug key: fine for testing, and later
      # builds install over earlier ones. Store releases need a private key.
      # x86_64 is included so the emulator smoke test can run the same APK.
      - name: Build APK
        working-directory: stablecoin-wallet/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pearl-wallet-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pearl-wallet-apk
          path: stablecoin-wallet/pearl-wallet-test.apk

  # Installs the APK on an emulator and fails if the app crashes on launch,
  # printing the crash from the device log.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pearl-wallet-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r pearl-wallet-test.apk
            adb logcat -c
            adb shell monkey -p $APP_ID -c android.intent.category.LAUNCHER 1
            sleep 30
            adb logcat -d > logcat.txt
            echo "----- crash and JS errors -----"; grep -E -A 40 "FATAL EXCEPTION|ReactNativeJS.*(Error|error)|Fatal signal" logcat.txt | head -300 || true
            adb shell pidof $APP_ID > /dev/null && echo "APP_RUNNING" || (echo "APP_NOT_RUNNING"; exit 1)
            adb shell input keyevent KEYCODE_HOME && sleep 5 && adb logcat -c
            echo "----- our job before forcing -----"; adb shell dumpsys jobscheduler | grep -A25 -E "JOB #.*$APP_ID" | head -40 || true
            JOB=$(adb shell dumpsys jobscheduler | grep -E "JOB #.*$APP_ID" | head -1 | sed -E 's|.*JOB #[^/]*/([0-9]+).*|\1|'); echo "1) forcing job $JOB with the app in the background"; adb shell cmd jobscheduler run -f $APP_ID $JOB || true
            sleep 40
            echo "----- background check log (app in background) -----"; adb logcat -d | grep -iE "pearl|WM-|BackgroundTask|TaskManager|ExpoTask|ReactNativeJS|AndroidRuntime" | grep -v NetworkScheduler | head -150 || true
            adb shell am kill $APP_ID && sleep 15
            echo "----- our job after closing the app -----"; adb shell dumpsys jobscheduler | grep -A25 -E "JOB #.*$APP_ID" | head -40 || true
            adb logcat -c
            JOB=$(adb shell dumpsys jobscheduler | grep -E "JOB #.*$APP_ID" | head -1 | sed -E 's|.*JOB #[^/]*/([0-9]+).*|\1|'); echo "2) forcing job $JOB with the app closed"; adb shell cmd jobscheduler run -f $APP_ID $JOB || true
            sleep 60
            echo "----- background check log (app closed) -----"; adb logcat -d | grep -iE "pearl|stablecoinwallet|WM-|BackgroundTask|TaskManager|TaskService|ExpoTask|Expo |ReactNativeJS|ReactHost|AndroidRuntime|FATAL" | grep -v -E "NetworkScheduler|googlequicksearchbox" | head -200 || true
            echo "----- our job after forcing -----"; adb shell dumpsys jobscheduler | grep -A12 -E "JOB #.*$APP_ID" | head -30 || true
            # Waking a closed app makes WorkManager replace its scheduled job on startup, which
            # cancels that first forced run. Force the replacement too, in the same headless process.
            sleep 10 && adb logcat -c
            JOB=$(adb shell dumpsys jobscheduler | grep -E "JOB #.*$APP_ID" | head -1 | sed -E 's|.*JOB #[^/]*/([0-9]+).*|\1|'); echo "3) forcing job $JOB again, app still closed"; adb shell cmd jobscheduler run -f $APP_ID $JOB || true
            sleep 60
            echo "----- background check log (app closed, second try) -----"; adb logcat -d | grep -iE "pearl|stablecoinwallet|WM-|BackgroundTask|TaskManager|TaskService|ExpoTask|Expo |ReactNativeJS|ReactHost|AndroidRuntime|FATAL" | grep -v -E "NetworkScheduler|googlequicksearchbox" | head -200 || true
            adb logcat -d | grep -q "\[pearl\] background check done" && echo "BACKGROUND_CHECK_RAN" || echo "BACKGROUND_CHECK_DID_NOT_RUN"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logcat
          path: logcat.txt

  release:
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pearl-wallet-apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pearl-wallet-test-${{ github.run_number }}
          name: Pearl Wallet test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: pearl-wallet-test.apk
          body: |
            Test build of Pearl Wallet for Android (test money by default).
            Open this page on your Android phone, tap **pearl-wallet-test.apk**, then install it.
            Not audited: do not use with significant real funds.
