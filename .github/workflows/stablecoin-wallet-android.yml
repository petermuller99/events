# Builds an installable Android test APK of Pearl and publishes
# it as a GitHub pre-release, so it can be downloaded straight to a phone.
name: Pearl Wallet Android build

on:
  push:
    branches: [claude/stablecoin-wallet-multi-chain-sc1vbq]
    paths: ['stablecoin-wallet/**', '.github/workflows/stablecoin-wallet-android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stablecoin-wallet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: stablecoin-wallet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stablecoin-wallet/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Signed with the template's shared debug key: fine for testing, and later
      # builds install over earlier ones. Store releases need a private key.
      - name: Build APK
        working-directory: stablecoin-wallet/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pearl-wallet-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pearl-wallet-apk
          path: stablecoin-wallet/pearl-wallet-test.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pearl-wallet-test-${{ github.run_number }}
          name: Pearl Wallet test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: stablecoin-wallet/pearl-wallet-test.apk
          body: |
            Test build of Pearl Wallet for Android (test money by default).
            Open this page on your Android phone, tap **pearl-wallet-test.apk**, then install it.
            Not audited: do not use with significant real funds.
